        const dm = Math.hypot(pts[i].x - mouse.x, pts[i].y - mouse.y);
        if (dm < 170) {
          ctx.strokeStyle = "rgba(255, 122, 184," + (0.5 * (1 - dm / 170)) + ")";
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
        }
      }
      if (!reduce) raf = requestAnimationFrame(frame);
    }

    const onMove = (e) => { mouse.x = e.clientX; mouse.y = e.clientY; };
    const onLeave = () => { mouse.x = -9999; mouse.y = -9999; };
    resize();
    frame();
    window.addEventListener("resize", resize);
    window.addEventListener("mousemove", onMove);
    document.addEventListener("mouseleave", onLeave);
    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener("resize", resize);
      window.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseleave", onLeave);
    };
  }, []);
  return <canvas className="bg" ref={ref} aria-hidden="true" />;
}

/* ---------- Mini game: Dodge the data leaks ---------- */
function Game() {
  const canvasRef = useRef(null);
  const jumpRef = useRef(() => {});
  const [score, setScore] = useState(0);
  const [best, setBest] = useState(() => {
    try { return Number(localStorage.getItem("takeoff_best")) || 0; } catch (e) { return 0; }
  });

  useEffect(() => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    const W = 760, H = 190, GROUND = 150;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.scale(dpr, dpr);

    const LABELS = ["PHONE", "EMAIL", "AADHAAR", "NAME", "CARD", "IP"];
    let state = "idle"; // idle | running | over
    let plane, obstacles, clouds, speed, dist, nextSpawn, last, raf, shownScore, bestLocal, groundOffset;
    bestLocal = best;

    function reset() {
      plane = { x: 70, y: GROUND - 26, w: 44, h: 26, vy: 0 };
      obstacles = [];
      clouds = [{ x: 150, y: 40, r: 16 }, { x: 420, y: 62, r: 12 }, { x: 640, y: 34, r: 18 }];
      speed = 5.2; dist = 0; nextSpawn = 320; shownScore = 0; groundOffset = 0;
      setScore(0);
    }

    function jump() {
      if (state !== "running") { reset(); state = "running"; last = performance.now(); return; }
      if (plane.y >= GROUND - plane.h - 0.5) plane.vy = -11.6;
    }
    jumpRef.current = jump;

    function rr(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function drawPlane() {
      const { x, y, w, h } = plane;
      ctx.save();
      ctx.shadowColor = "rgba(255, 61, 154, 0.7)";
      ctx.shadowBlur = 14;
      ctx.fillStyle = "#ff3d9a";
      ctx.beginPath();
      ctx.moveTo(x, y + 2);
      ctx.lineTo(x + w, y + h / 2);
      ctx.lineTo(x, y + h - 2);
      ctx.lineTo(x + 11, y + h / 2);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(x + 11, y + h / 2);
      ctx.lineTo(x + w - 4, y + h / 2);
      ctx.stroke();
    }

    function drawText(t, y, size, color) {
      ctx.fillStyle = color;
      ctx.font = "600 " + size + "px system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(t, W / 2, y);
    }

    function render() {
      ctx.clearRect(0, 0, W, H);
      for (const c of clouds) {
        ctx.fillStyle = "rgba(255,255,255,0.05)";
        ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2); ctx.arc(c.x + c.r, c.y + 4, c.r * 0.8, 0, Math.PI * 2); ctx.fill();
      }
      ctx.strokeStyle = "rgba(255, 61, 154, 0.5)";
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, GROUND + 1); ctx.lineTo(W, GROUND + 1); ctx.stroke();
      ctx.strokeStyle = "rgba(255, 61, 154, 0.25)";
      for (let x = -groundOffset % 40; x < W; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, GROUND + 12); ctx.lineTo(x + 16, GROUND + 12); ctx.stroke();
      }
      for (const o of obstacles) {
        ctx.fillStyle = "#1a0b13";
        ctx.strokeStyle = "#ff3d9a";
        ctx.lineWidth = 2;
        rr(o.x, GROUND - o.h, o.w, o.h, 6);
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#ff7ab8";
        ctx.font = "700 10px system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(o.label, o.x + o.w / 2, GROUND - o.h / 2 + 4);
      }
      drawPlane();
      if (state === "idle") {
        drawText("Press Space or tap to take off", 78, 18, "#f4f4f5");
        drawText("Jump over the data leaks", 102, 13, "#a1a1aa");
      }
      if (state === "over") {
        drawText("Data leaked!", 72, 22, "#ff7ab8");
        drawText("Press Space or tap to try again", 100, 13, "#a1a1aa");
      }
    }

    function update(dt) {
      speed = Math.min(11, speed + 0.0016 * dt);
      groundOffset += speed * dt;
      dist += speed * dt;
      plane.vy += 0.62 * dt;
      plane.y += plane.vy * dt;
      if (plane.y > GROUND - plane.h) { plane.y = GROUND - plane.h; plane.vy = 0; }

      for (const c of clouds) { c.x -= speed * 0.15 * dt; if (c.x < -40) c.x = W + 40; }
      nextSpawn -= speed * dt;
      if (nextSpawn <= 0) {
        const h = 30 + Math.floor(Math.random() * 22);
        obstacles.push({ x: W + 10, w: 58, h, label: LABELS[Math.floor(Math.random() * LABELS.length)] });
        nextSpawn = 280 + Math.random() * 200 + speed * 12;
      }
      for (const o of obstacles) o.x -= speed * dt;
      obstacles = obstacles.filter((o) => o.x + o.w > -10);

      for (const o of obstacles) {
        const px = plane.x + 6, pw = plane.w - 12, py = plane.y + 5, ph = plane.h - 8;
        if (px < o.x + o.w - 4 && px + pw > o.x + 4 && py < GROUND && py + ph > GROUND - o.h + 4) {
          state = "over";
          const final = Math.floor(dist / 10);
          if (final > bestLocal) {
            bestLocal = final;
            setBest(final);
            try { localStorage.setItem("takeoff_best", String(final)); } catch (e) {}
          }
        }
      }
      const s = Math.floor(dist / 10);
      if (s !== shownScore) { shownScore = s; setScore(s); }
    }

    function loop(now) {
      if (state === "running") {
        const dt = Math.min(2, (now - last) / 16.67);
        last = now;
        update(dt);
      }
      render();
      raf = requestAnimationFrame(loop);
    }

    reset();
    raf = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(raf);
  }, []);

  function onKey(e) {
    if (e.code === "Space" || e.code === "ArrowUp") {
      e.preventDefault();
      jumpRef.current();
    }
  }

  return (
    <div className="game-card">
      <div className="game-head">
        <h3>Dodge the data leaks <span>a tiny game</span></h3>
        <div className="scores">Score <b>{score}</b> &nbsp;|&nbsp; Best <b>{best}</b></div>
      </div>
      <div className="game-wrap" tabIndex={0} onKeyDown={onKey} aria-label="Mini game. Press space to jump.">
        <canvas ref={canvasRef} onPointerDown={(e) => { e.currentTarget.parentNode.focus(); jumpRef.current(); }} />
      </div>
      <p className="game-tip">Click the game, then press Space or the up arrow (or tap on a phone) to jump.</p>
    </div>
  );
}

/* ---------- Pieces ---------- */
function Highlighted({ text }) {
  const parts = text.split(/(<[A-Z_]+_\d+>)/g);
  return (
    <p className="text">
      {parts.map((p, i) =>
        /^<[A-Z_]+_\d+>$/.test(p)
          ? <span key={i} className="tag">{p}</span>
          : <span key={i}>{p}</span>
      )}
    </p>
  );
}

function tilt(e) {
  const el = e.currentTarget;
  const r = el.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width - 0.5;
  const y = (e.clientY - r.top) / r.height - 0.5;
  el.style.setProperty("--mx", ((x + 0.5) * 100) + "%");
  el.style.setProperty("--my", ((y + 0.5) * 100) + "%");
  el.style.transform = "perspective(700px) rotateY(" + (x * 7) + "deg) rotateX(" + (-y * 7) + "deg) translateY(-2px)";
}
function untilt(e) { e.currentTarget.style.transform = ""; }

function FeatureGrid() {
  return (
    <div className="features">
      {FEATURES.map((f) => (
        <div className="feat" key={f.n} onMouseMove={tilt} onMouseLeave={untilt}>
          <div className="n">{f.n}</div>
          <h3>{f.t}</h3>
          <p>{f.d}</p>
        </div>
      ))}
    </div>
  );
}

function SiteFooter({ onContact, onPrivacy, onAbout }) {
  return (
    <div className="sitefoot">
      <span>&copy; 2026 TAKE OFF &middot; Built by {BUILDER}</span>
      <span className="links">
        <button onClick={onAbout}>About</button>
        <button onClick={onPrivacy}>Privacy notice</button>
        <button onClick={onContact}>Contact</button>
        <a href={LINKEDIN} target="_blank" rel="noopener">LinkedIn</a>
        <a href={GMAIL} target="_blank" rel="noopener">{EMAIL}</a>
      </span>
    </div>
  );
}

function Welcome({ onContact, onPrivacy, onAbout }) {
  return (
    <div>
      <div className="hero">
        <span className="pill">Live demo (lite version)</span>
        <h1>TAKE OFF</h1>
        <p>
          <b>Take off your private information</b> before AI ever sees it. Paste a document full of
          personal data, let the AI do the work, and get your answer back with the real details restored.
        </p>
        <div className="badges">
          <span className="badge">Redaction runs in your browser</span>
          <span className="badge">No raw text in logs</span>
          <span className="badge">Aadhaar and +91 aware</span>
          <span className="badge">Move your mouse around</span>
        </div>
      </div>

      <div className="flow">
        {STEPS.map((s, i) => (
          <div key={i}><b><i>{i + 1}</i>{s.t}</b>{s.d}</div>
        ))}
      </div>

      <Game />

      <div className="section-title">What TAKE OFF can do</div>
      <FeatureGrid />

      <p className="hint">Paste a document below, or pick a sample, to try it.</p>
      <SiteFooter onContact={onContact} onPrivacy={onPrivacy} onAbout={onAbout} />
    </div>
  );
}

function download(name, content) {
  const blob = new Blob([content], { type: "text/plain" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}

function Turn({ turn }) {
  const [copied, setCopied] = useState(false);
  const r = turn.result;

  function copy() {
    navigator.clipboard.writeText(r.answer);
    setCopied(true);
    setTimeout(() => setCopied(false), 1400);
  }

  return (
    <div className="turn">
      <div className="user-row">
        <div className="user-bubble">
          <div className="q">{turn.question}</div>
          <div className="doc">{turn.original}</div>
        </div>
      </div>

      <div className="bot-head">
        <span className="logo-badge"><PlaneIcon size={12} /></span> TAKE OFF
      </div>

      <div className="cols">
        <div className="card">
          <p className="card-title">Before (your original)</p>
          <p className="text">{turn.original}</p>
        </div>
        <div className="card">
          <p className="card-title">After (what the AI sees)</p>
          <Highlighted text={r.redacted_text} />
        </div>
      </div>

      <div className="card" style={{ marginTop: 12 }}>
        <p className="card-title">Privacy log</p>
        {Object.keys(r.counts).length === 0
          ? <span className="chip ok">No personal data found</span>
          : Object.entries(r.counts).map(([k, v]) => (
              <span className="chip" key={k}>{k} x{v}</span>
            ))}
      </div>

      <div className="card">
        <p className="card-title">What the AI actually wrote (labels only)</p>
        <Highlighted text={r.ai_answer} />
      </div>

      <div className="card final">
        <p className="card-title">
          <span>Your final answer (real values restored on your side)</span>
          <span className="actions">
            <button className="mini" onClick={copy}>{copied ? "Copied" : "Copy"}</button>
            <button className="mini" onClick={() => download("take-off-answer.txt", r.answer)}>Download</button>
          </span>
        </p>
        <p className="text">{r.answer}</p>
      </div>
    </div>
  );
}

function Modal({ onClose, label, children }) {
  useEffect(() => {
    const onKey = (e) => e.key === "Escape" && onClose();
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" role="dialog" aria-modal="true" aria-label={label} onClick={(e) => e.stopPropagation()}>
        <button className="close" onClick={onClose}>Close</button>
        {children}
      </div>
    </div>
  );
}

/* ---------- App ---------- */
function App() {
  const [text, setText] = useState("");
  const [question, setQuestion] = useState("Draft a polite reply.");
  const [turns, setTurns] = useState([]);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [modal, setModal] = useState(null);
  const [online, setOnline] = useState(null);
  const [emailCopied, setEmailCopied] = useState(false);
  const endRef = useRef(null);
  const glowRef = useRef(null);
  const fileRef = useRef(null);

  useEffect(() => {
    endRef.current && endRef.current.scrollIntoView({ behavior: "smooth", block: "end" });
  }, [turns, loading, error]);

  useEffect(() => {
    const move = (e) => {
      if (glowRef.current) glowRef.current.style.transform = "translate(" + e.clientX + "px," + e.clientY + "px)";
    };
    window.addEventListener("mousemove", move);
    return () => window.removeEventListener("mousemove", move);
  }, []);

  function checkServer() {
    fetch("/audit").then((r) => setOnline(r.ok)).catch(() => setOnline(false));
  }
  useEffect(checkServer, []);

  const protectedCount = turns.reduce(
    (sum, t) => sum + Object.values(t.result.counts).reduce((a, b) => a + b, 0), 0
  );

  async function run() {
    if (loading || !text.trim()) return;
    setLoading(true);
    setError("");
    const original = text;
    const q = question.trim() || "Summarize this document.";
    try {
      const res = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: original, question: q }),
      });
      if (!res.ok) throw new Error("Server error " + res.status);
      const data = await res.json();
      setTurns((t) => [...t, { id: Date.now(), question: q, original, result: data }]);
      setOnline(true);
    } catch (e) {
      setError(e.message + ". Is the server running?");
      checkServer();
    }
    setLoading(false);
  }

  function newChat() { setTurns([]); setError(""); setText(""); }

  function onFile(e) {
    const f = e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => setText(String(reader.result).slice(0, 20000));
    reader.readAsText(f);
    e.target.value = "";
  }

  function copyEmail() {
    navigator.clipboard.writeText(EMAIL);
    setEmailCopied(true);
    setTimeout(() => setEmailCopied(false), 1400);
  }

  const close = () => setModal(null);

  return (
    <>
      <Particles />
      <div className="glow" ref={glowRef} aria-hidden="true" />
      <div className="app">
        <header className="top">
          <div className="logo">
            <span className="logo-badge"><PlaneIcon size={17} /></span>
            TAKE OFF
            <span className="status" title="Connection to your local server">
              <span className={"dot " + (online === true ? "on" : online === false ? "off" : "")}></span>
              {online === true ? "Connected" : online === false ? "Server offline" : "Checking"}
            </span>
          </div>
          <nav className="nav" aria-label="Main">
            {protectedCount > 0 && <span className="protected">{protectedCount} items protected</span>}
            <button onClick={() => setModal("about")}>About</button>
            <button onClick={() => setModal("features")}>Features</button>
            <button className="play" onClick={() => setModal("play")}>Play</button>
            <button onClick={() => setModal("contact")}>Contact</button>
            <button className="newchat" onClick={newChat}>New chat</button>
          </nav>
        </header>

        <main className="stream">
          <div className="inner">
            {turns.length === 0 && !loading && !error && (
              <Welcome onContact={() => setModal("contact")} onPrivacy={() => setModal("privacy")} onAbout={() => setModal("about")} />
            )}
            {turns.map((t) => <Turn key={t.id} turn={t} />)}
            {loading && (
              <div className="loading">
                <div className="dots"><span></span><span></span><span></span></div>
                Taking off your private information...
                <button onClick={() => setModal("play")}>Play a quick game while you wait</button>
              </div>
            )}
            {error && <div className="error">Something went wrong: {error}</div>}
            <div ref={endRef} />
          </div>
        </main>

        <div className="composer-wrap">
          <div className="composer">
            <div className="tools">
              <select aria-label="Load a sample document" value="" onChange={(e) => { if (e.target.value) setText(SAMPLES[e.target.value]); }}>
                <option value="">Try a sample...</option>
                <option value="ticket">Support ticket</option>
                <option value="hr">HR onboarding email</option>
                <option value="bank">Bank call log</option>
              </select>
              <button className="ghost" onClick={() => fileRef.current.click()}>Upload .txt</button>
              <input ref={fileRef} type="file" accept=".txt,.md,.csv" onChange={onFile} style={{ display: "none" }} />
              {text && <button className="ghost" onClick={() => setText("")}>Clear</button>}
              <span className="count">{text.length.toLocaleString()} characters</span>
            </div>
            <textarea
              aria-label="Your text"
              value={text}
              onChange={(e) => setText(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) run(); }}
              placeholder="Paste your text here (fake or synthetic data only)..."
            />
            <div className="quick">
              {QUICK.map((q) => <button key={q} onClick={() => setQuestion(q)}>{q}</button>)}
            </div>
            <div className="composer-row">
              <input
                type="text"
                aria-label="What should the AI do?"
                value={question}
                onChange={(e) => setQuestion(e.target.value)}
                onKeyDown={(e) => { if (e.key === "Enter") run(); }}
                placeholder="What should the AI do? e.g. Summarize this ticket"
              />
              <button className="send" onClick={run} disabled={loading || !text.trim()}>
                {loading ? "Working..." : "Take off"} <PlaneIcon size={15} />
              </button>
            </div>
          </div>
          <div className="foot">Ctrl + Enter to send. Demo only, use fake data. AI drafts can contain mistakes, so review before sending.</div>
        </div>

        {modal === "about" && (
          <Modal onClose={close} label="About">
            <h2>About <span>TAKE OFF</span></h2>
            <p>
              Companies want to use AI on real documents like support tickets, emails and notes, but those
              are full of personal data. Sending them to an outside AI service can put customers at risk and
              break privacy rules such as India's DPDP Act and GDPR.
            </p>
            <p>
              <b>TAKE OFF</b> sits between you and the AI. It removes the private details first (that is the
              "taking off"), lets the AI work on safe placeholders, then lands the answer back with the real
              details restored, on your side only.
            </p>
            <ul>
              <li>Your private data never reaches the AI model.</li>
              <li>Nothing personal is written to logs. Only counts and timestamps.</li>
              <li>You can always see exactly what the AI was shown.</li>
            </ul>
            <p><b>Built by {BUILDER}</b>, an electronics and communication engineering graduate, using Python, FastAPI,
              Semantic Kernel, Microsoft Presidio and React.</p>
            <div className="btnrow">
              <a className="linkbtn" href={GMAIL} target="_blank" rel="noopener">Email {BUILDER.split(" ")[0]}</a>
              <a className="linkbtn" href={LINKEDIN} target="_blank" rel="noopener">LinkedIn</a>
            </div>
          </Modal>
        )}

        {modal === "features" && (
          <Modal onClose={close} label="Features">
            <h2>Features</h2>
            <p style={{ marginTop: 0 }}>Everything TAKE OFF does between your document and the AI.</p>
            <FeatureGrid />
          </Modal>
        )}

        {modal === "play" && (
          <Modal onClose={close} label="Play">
            <h2>Take a <span>break</span></h2>
            <Game />
          </Modal>
        )}

        {modal === "contact" && (
          <Modal onClose={close} label="Contact">
            <h2>Contact</h2>
            <p>Questions, feedback, or want to work together? Send a message and I will reply as soon as I can.</p>
            <div className="email-box">{EMAIL}</div>
            <div className="btnrow">
              <a className="linkbtn" href={GMAIL} target="_blank" rel="noopener">Send an email</a>
              <button className="ghost" onClick={copyEmail}>{emailCopied ? "Copied" : "Copy email"}</button>
              <a className="linkbtn" href={LINKEDIN} target="_blank" rel="noopener">LinkedIn</a>
            </div>
          </Modal>
        )}

        {modal === "privacy" && (
          <Modal onClose={close} label="Privacy notice">
            <h2>Privacy <span>notice</span></h2>
            <p>This is a demo project, and here is exactly how it handles your text:</p>
            <ul>
              <li>Detection and redaction run in your browser, before anything is sent anywhere.</li>
              <li>Only the redacted text, with labels like PERSON_1, is sent through a small Cloudflare Worker to the AI provider (Groq in this demo).</li>
              <li>The map from labels back to real values is sent through a small Cloudflare Worker to the AI provider (Groq in thstays in your browser and is never sent to the model.is demo).</li>
              <li>The audit log keeps only counts and timestamps. Raw text is not stored.</li>
              <li>Detection is not perfect, so please use fake or synthetic data when you try it.</li>
            </ul>
          </Modal>
        )}
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
